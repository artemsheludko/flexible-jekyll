title: Michael A. Heroux
description: >
  Michael A. Heroux — scientific and high-performance computing software.
  Founder of Trilinos, Kokkos, Mantevo, and HPCG; former director of software
  technology for the US Exascale Computing Project.
url: "https://maherou.github.io"
baseurl: ""

# Author / contact settings — used throughout the site via {{ site.* }}
author: Michael A. Heroux
author_short: Mike Heroux
author_img: MikeHerouxHeadshot.jpg
tagline: Scientific software for high-performance computing
email: mheroux@acm.org
social:
  linkedin: michael-heroux-763590
  github: maherou
  google_scholar: "citations?user=3o3TleEAAAAJ&hl=en"

# Primary site navigation — edit this list to add/remove/reorder nav items
nav:
  - title: Bio
    url: /Bio/
  - title: Now
    url: /Now/
  - title: Research
    url: /Projects/
  - title: Papers
    url: https://collegeville.github.io/Papers
    external: true
  - title: Personal Projects
    url: https://areflectionofyou.github.io
    external: true
  - title: Teaching Archive
    url: https://collegeville.github.io/Corpus/
    external: true
  - title: CV
    url: /files/cv/

# Google Analytics measurement ID (leave blank to disable)
analytics:

# Build settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

collections:
  projects:
    output: true
    permalink: /Projects/:name/
    sort_by: order

defaults:
  # Default social share image (og:image / twitter:image) for link previews,
  # e.g. when pasting the site URL into iMessage or Slack. Individual pages
  # can override by setting their own `image` front matter.
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/social-share.jpg
        width: 1200
        height: 1200
        alt: "Portrait of Michael A. Heroux"
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  # Shared privately by direct link only — keep it out of sitemap.xml without giving it
  # front matter (it's a large hand-written static file; front matter would route it through
  # Liquid, which is unnecessary risk for a page that never needs templating).
  - scope:
      path: "2025HerouxFamilyAlbum.html"
    values:
      sitemap: false

exclude:
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
